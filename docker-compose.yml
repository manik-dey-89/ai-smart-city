version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4-alpine
    environment:
      POSTGRES_USER: smartcity
      POSTGRES_PASSWORD: smartcity123
      POSTGRES_DB: smartcity
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOTE: Port 5432 is exposed for local development/tooling convenience.
    # Remove or restrict this binding in production to avoid public exposure.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    # NOTE: The ./backend:/app volume mount is intentionally removed — it
    # would overwrite the image's /app with host sources (dev-only behaviour).
    # For live-reload dev, re-add the volume and change the CMD to include --reload.
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://smartcity:smartcity123@db:5432/smartcity
      SECRET_KEY: your-super-secret-production-key-change-this
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      BACKEND_CORS_ORIGINS: "http://localhost:3000,http://localhost"
    # Optional: supply extra env vars (GOOGLE_CLIENT_ID, SECRET_KEY override, etc.)
    # via ./backend/.env without editing this file.
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Pass your Google OAuth client ID at build time:
        #   docker compose build --build-arg VITE_GOOGLE_CLIENT_ID=xxx frontend
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:80"
    depends_on:
      - backend
    # Optional: supply VITE_GOOGLE_CLIENT_ID via ./frontend/.env.production
    env_file:
      - path: ./frontend/.env.production
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
